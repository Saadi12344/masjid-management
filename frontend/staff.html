<div class="app-main">

    <div class="page-header">
        <div>
            <h1>Staff Management</h1>
            <p>Manage all Masjid Staff Members</p>
        </div>
    </div>

    <div class="form-card card mb-4">
        <div class="card-header"><i class="fa-solid fa-user-plus"></i> Add New Staff</div>
        <div class="card-body">
            <form id="staffForm">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Staff ID</label>
                        <input type="text" class="form-control" id="staffId" readonly>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Enter Full Name">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Designation</label>
                        <input type="text" class="form-control" id="designation" placeholder="Imam / Muazzin / Khadim">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Salary</label>
                        <input type="number" class="form-control" id="salary" placeholder="Enter Salary">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">CNIC</label>
                        <input type="text" class="form-control" id="cnic" maxlength="15" placeholder="42101-1234567-1">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone" placeholder="03XXXXXXXXX">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">City</label>
                        <input type="text" class="form-control" id="city" placeholder="Enter City">
                    </div>
                </div>
                <button type="submit" class="btn btn-brand mt-4"><i class="fa-solid fa-floppy-disk"></i> Save Staff</button>
            </form>
        </div>
    </div>

    <div class="table-card card">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span>Staff List</span>
            <div class="d-flex gap-2 flex-wrap">
                <button type="button" class="btn btn-outline-success btn-sm" id="exportBtn"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
                <input type="text" class="form-control form-control-sm w-auto" id="searchStaff" placeholder="Search Staff...">
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr><th>Staff ID</th><th>Name</th><th>Designation</th><th>Salary</th><th>CNIC</th><th>Phone</th><th>City</th><th>Action</th></tr>
                    </thead>
                    <tbody id="staffTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header modal-header-brand">
                    <h5 class="modal-title">Edit Staff</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label">Full Name</label><input type="text" class="form-control mb-3" id="editName">
                    <label class="form-label">Designation</label><input type="text" class="form-control mb-3" id="editDesignation">
                    <label class="form-label">Salary</label><input type="number" class="form-control mb-3" id="editSalary">
                    <label class="form-label">Phone</label><input type="text" class="form-control mb-3" id="editPhone">
                    <label class="form-label">City</label><input type="text" class="form-control" id="editCity">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-brand" id="updateBtn">Update Staff</button>
                </div>
            </div>
        </div>
    </div>


</div>
