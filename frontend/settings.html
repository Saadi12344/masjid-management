<div class="app-main">

    <div class="page-header">
        <div>
            <h1>Settings</h1>
            <p>Manage Masjid & Account Settings</p>
        </div>
    </div>

    <div class="form-card card mb-4">
        <div class="card-header"><i class="fa-solid fa-mosque"></i> Masjid Information</div>
        <div class="card-body">
            <form id="settingsForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Masjid Name</label>
                        <input type="text" class="form-control" id="masjidName" placeholder="Enter Masjid Name">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Imam Name</label>
                        <input type="text" class="form-control" id="imamName" placeholder="Enter Imam Name">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Address</label>
                        <input type="text" class="form-control" id="address" placeholder="Enter Full Address">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone" placeholder="03XXXXXXXXX">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="masjid@example.com">
                    </div>
                </div>
                <button type="submit" class="btn btn-brand mt-4"><i class="fa-solid fa-floppy-disk"></i> Save Settings</button>
            </form>
        </div>
    </div>

    <div class="form-card card">
        <div class="card-header"><i class="fa-solid fa-lock"></i> Change Password</div>
        <div class="card-body">
            <form id="passwordForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Current Password</label>
                        <input type="password" class="form-control" id="currentPassword" placeholder="Enter Current Password">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">New Password</label>
                        <input type="password" class="form-control" id="newPassword" placeholder="Enter New Password">
                    </div>
                </div>
                <button type="submit" class="btn btn-brand mt-4"><i class="fa-solid fa-lock"></i> Update Password</button>
            </form>
        </div>
    </div>


</div>
