<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Masjid Management</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body>

<nav class="app-topbar">
    <div class="d-flex align-items-center gap-3">
        <button type="button" class="sidebar-toggle-btn d-lg-none" id="sidebarToggle" title="Menu">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="topbar-brand">
            <i class="fa-solid fa-mosque"></i>
            <span id="topbarBrandName">Jama Masjid As-Salam</span>
        </div>
    </div>
    <div class="d-flex align-items-center gap-3">
        <button type="button" class="theme-toggle" id="themeToggle" title="Toggle dark mode">
            <i class="fa-solid fa-moon"></i>
        </button>
        <i class="fa-solid fa-bell text-secondary"></i>
        <span class="admin-chip" id="loggedInUserName">Admin</span>
        <i class="fa-solid fa-right-from-bracket text-danger" id="logoutBtn" title="Logout" style="cursor:pointer;"></i>
    </div>
</nav>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="app-sidebar" id="appSidebar">
    <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" href="dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="staff.html">
                    <i class="fa-solid fa-users"></i>
                    <span>Staff</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="students.html">
                    <i class="fa-solid fa-user-graduate"></i>
                    <span>Students</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="donations.html">
                    <i class="fa-solid fa-hand-holding-dollar"></i>
                    <span>Donations</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="expenses.html">
                    <i class="fa-solid fa-money-bill-wave"></i>
                    <span>Expenses</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="rentals.html">
                    <i class="fa-solid fa-key"></i>
                    <span>Rentals</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="prayer.html">
                    <i class="fa-solid fa-clock"></i>
                    <span>Prayer Times</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="events.html">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Events</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link active" href="reports.html">
                    <i class="fa-solid fa-chart-column"></i>
                    <span>Reports</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="settings.html">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>
            </li>
    </ul>
</div>

<div class="app-main">

    <div class="page-header">
        <div>
            <h1>Reports</h1>
            <p>Overview of Masjid Financial Activity</p>
        </div>
    </div>

    <div class="form-card card mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label">From Date</label>
                    <input type="date" class="form-control" id="fromDate">
                </div>
                <div class="col-md-4">
                    <label class="form-label">To Date</label>
                    <input type="date" class="form-control" id="toDate">
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button type="button" class="btn btn-brand" id="applyFilterBtn"><i class="fa-solid fa-filter"></i> Apply Filter</button>
                    <button type="button" class="btn btn-outline-secondary" id="clearFilterBtn">Clear</button>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3 mb-4" id="summaryCards"></div>

    <div class="table-card card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>Recent Donations</span>
            <button id="printBtn" class="btn btn-brand btn-sm"><i class="fa-solid fa-print"></i> Print Report</button>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead><tr><th>Donor</th><th>Amount</th><th>Date</th><th>Status</th></tr></thead>
                    <tbody id="donationsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="table-card card">
        <div class="card-header">Recent Expenses</div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead><tr><th>Title</th><th>Category</th><th>Amount</th><th>Date</th></tr></thead>
                    <tbody id="expensesTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>


</div>

<script src="auth-guard.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="utils.js"></script>
<script src="reports.js"></script>
</body>
</html>
