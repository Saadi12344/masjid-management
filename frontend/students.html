    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body>

        <i class="fa-solid fa-mosque"></i>
        <span>Jama Masjid As-Salam</span>

        <button type="button" class="theme-toggle" id="themeToggle" title="Toggle dark mode">
            <i class="fa-solid fa-moon"></i>
        </button>
        <i class="fa-solid fa-bell text-secondary"></i>
        <span class="admin-chip" id="loggedInUserName">Admin</span>
        <i class="fa-solid fa-right-from-bracket text-danger" id="logoutBtn" title="Logout" style="cursor:pointer;"></i>
    </div>
</nav>

<div class="app-sidebar">
    <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" href="dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="staff.html">
                    <i class="fa-solid fa-users"></i>
                    <span>Staff</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link active" href="students.html">
                    <i class="fa-solid fa-user-graduate"></i>
                    <span>Students</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="donations.html">
                    <i class="fa-solid fa-hand-holding-dollar"></i>
                    <span>Donations</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="expenses.html">
                    <i class="fa-solid fa-money-bill-wave"></i>
                    <span>Expenses</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="rentals.html">
                    <i class="fa-solid fa-key"></i>
                    <span>Rentals</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="prayer.html">
                    <i class="fa-solid fa-clock"></i>
                    <span>Prayer Times</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="events.html">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Events</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="reports.html">
                    <i class="fa-solid fa-chart-column"></i>
                    <span>Reports</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="settings.html">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>
            </li>
    </ul>
</div>

<div class="app-main">

    <div class="page-header">
        <div>
            <h1>Students</h1>
            <p>Manage Madrasa Students</p>
        </div>
    </div>

    <div class="form-card card mb-4">
        <div class="card-header"><i class="fa-solid fa-user-graduate"></i> Add New Student</div>
        <div class="card-body">
            <form id="studentForm">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Student ID</label>
                        <input type="text" class="form-control" id="studentId" readonly>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label">Student Name</label>
                        <input type="text" class="form-control" id="studentName" placeholder="Enter Student Name">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Father Name</label>
                        <input type="text" class="form-control" id="fatherName" placeholder="Enter Father Name">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Class</label>
                        <input type="text" class="form-control" id="studentClass" placeholder="e.g. Hifz, Nazra, Class 5">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Monthly Fee (Rs.)</label>
                        <input type="number" class="form-control" id="fee" placeholder="Enter Fee">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone" placeholder="03XXXXXXXXX">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Address</label>
                        <input type="text" class="form-control" id="address" placeholder="Enter Address">
                    </div>
                </div>
                <button type="submit" class="btn btn-brand mt-4"><i class="fa-solid fa-floppy-disk"></i> Save Student</button>
            </form>
        </div>
    </div>

    <div class="table-card card">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span>Student List</span>
            <input type="text" class="form-control form-control-sm w-auto" id="searchBox" placeholder="Search Students...">
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead><tr><th>ID</th><th>Name</th><th>Father Name</th><th>Class</th><th>Fee</th><th>Phone</th><th>Action</th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header modal-header-brand">
                    <h5 class="modal-title">Edit Student</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label">Student Name</label><input type="text" class="form-control mb-3" id="editStudentName">
                    <label class="form-label">Father Name</label><input type="text" class="form-control mb-3" id="editFatherName">
                    <label class="form-label">Class</label><input type="text" class="form-control mb-3" id="editClass">
                    <label class="form-label">Monthly Fee (Rs.)</label><input type="number" class="form-control mb-3" id="editFee">
                    <label class="form-label">Phone</label><input type="text" class="form-control mb-3" id="editPhone">
                    <label class="form-label">Address</label><input type="text" class="form-control" id="editAddress">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-brand" id="updateBtn">Update Student</button>
                </div>
            </div>
        </div>
    </div>


</div>

<script src="auth-guard.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="students.js"></script>
</body>
</html>
