<div class="app-main">

    <div class="page-header">
        <div>
            <h1>Donations</h1>
            <p>Manage all Masjid Donations</p>
        </div>
    </div>

    <div class="form-card card mb-4">
        <div class="card-header"><i class="fa-solid fa-hand-holding-dollar"></i> Add New Donation</div>
        <div class="card-body">
            <form id="donationForm">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Donation ID</label>
                        <input type="text" class="form-control" id="donationId" readonly>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label">Donor Name</label>
                        <input type="text" class="form-control" id="donorName" placeholder="Enter Donor Name">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Amount (Rs.)</label>
                        <input type="number" class="form-control" id="amount" placeholder="Enter Amount">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone" placeholder="03XXXXXXXXX">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Purpose</label>
                        <select class="form-select" id="purpose">
                            <option value="Zakat">Zakat</option>
                            <option value="Sadqa">Sadqa</option>
                            <option value="General">General Donation</option>
                            <option value="Construction">Construction Fund</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Date</label>
                        <input type="date" class="form-control" id="date">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="status">
                            <option value="Paid">Paid</option>
                            <option value="Pending">Pending</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-brand mt-4"><i class="fa-solid fa-floppy-disk"></i> Save Donation</button>
            </form>
        </div>
    </div>

    <div class="table-card card">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span>Donation Records</span>
            <div class="d-flex gap-2 flex-wrap">
                <button type="button" class="btn btn-outline-success btn-sm" id="exportBtn"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
                <input type="text" class="form-control form-control-sm w-auto" id="searchBox" placeholder="Search Donations...">
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead><tr><th>ID</th><th>Donor</th><th>Amount</th><th>Phone</th><th>Purpose</th><th>Date</th><th>Status</th><th>Action</th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header modal-header-brand">
                    <h5 class="modal-title">Edit Donation</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label">Donor Name</label><input type="text" class="form-control mb-3" id="editDonorName">
                    <label class="form-label">Amount (Rs.)</label><input type="number" class="form-control mb-3" id="editAmount">
                    <label class="form-label">Phone</label><input type="text" class="form-control mb-3" id="editPhone">
                    <label class="form-label">Purpose</label>
                    <select class="form-select mb-3" id="editPurpose">
                        <option value="Zakat">Zakat</option>
                        <option value="Sadqa">Sadqa</option>
                        <option value="General">General Donation</option>
                        <option value="Construction">Construction Fund</option>
                    </select>
                    <label class="form-label">Date</label><input type="date" class="form-control mb-3" id="editDate">
                    <label class="form-label">Status</label>
                    <select class="form-select" id="editStatus">
                        <option value="Paid">Paid</option>
                        <option value="Pending">Pending</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-brand" id="updateBtn">Update Donation</button>
                </div>
            </div>
        </div>
    </div>


</div>
