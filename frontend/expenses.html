<div class="app-main">

    <div class="page-header">
        <div>
            <h1>Expenses</h1>
            <p>Manage all Masjid Expenses</p>
        </div>
    </div>

    <div class="form-card card mb-4">
        <div class="card-header"><i class="fa-solid fa-money-bill-wave"></i> Add New Expense</div>
        <div class="card-body">
            <form id="expenseForm">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Expense ID</label>
                        <input type="text" class="form-control" id="expenseId" readonly>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label">Title</label>
                        <input type="text" class="form-control" id="title" placeholder="e.g. Electricity Bill">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Category</label>
                        <select class="form-select" id="category">
                            <option value="Utilities">Utilities</option>
                            <option value="Maintenance">Maintenance</option>
                            <option value="Salary">Salary</option>
                            <option value="Construction">Construction</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Amount (Rs.)</label>
                        <input type="number" class="form-control" id="amount" placeholder="Enter Amount">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Date</label>
                        <input type="date" class="form-control" id="date">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Description</label>
                        <input type="text" class="form-control" id="description" placeholder="Short description">
                    </div>
                </div>
                <button type="submit" class="btn btn-brand mt-4"><i class="fa-solid fa-floppy-disk"></i> Save Expense</button>
            </form>
        </div>
    </div>

    <div class="table-card card">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span>Expense Records</span>
            <div class="d-flex gap-2 flex-wrap">
                <button type="button" class="btn btn-outline-success btn-sm" id="exportBtn"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
                <input type="text" class="form-control form-control-sm w-auto" id="searchBox" placeholder="Search Expenses...">
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Amount</th><th>Date</th><th>Description</th><th>Action</th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header modal-header-brand">
                    <h5 class="modal-title">Edit Expense</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label">Title</label><input type="text" class="form-control mb-3" id="editTitle">
                    <label class="form-label">Category</label>
                    <select class="form-select mb-3" id="editCategory">
                        <option value="Utilities">Utilities</option>
                        <option value="Maintenance">Maintenance</option>
                        <option value="Salary">Salary</option>
                        <option value="Construction">Construction</option>
                        <option value="Other">Other</option>
                    </select>
                    <label class="form-label">Amount (Rs.)</label><input type="number" class="form-control mb-3" id="editAmount">
                    <label class="form-label">Date</label><input type="date" class="form-control mb-3" id="editDate">
                    <label class="form-label">Description</label><input type="text" class="form-control" id="editDescription">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-brand" id="updateBtn">Update Expense</button>
                </div>
            </div>
        </div>
    </div>


</div>
