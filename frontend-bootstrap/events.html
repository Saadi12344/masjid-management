<div class="app-main">

    <div class="page-header">
        <div>
            <h1>Events</h1>
            <p>Manage Masjid Events</p>
        </div>
    </div>

    <div class="form-card card mb-4">
        <div class="card-header"><i class="fa-solid fa-calendar-days"></i> Add New Event</div>
        <div class="card-body">
            <form id="eventForm">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Event ID</label>
                        <input type="text" class="form-control" id="eventId" readonly>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label">Event Name</label>
                        <input type="text" class="form-control" id="eventName" placeholder="e.g. Milad un Nabi Gathering">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Venue</label>
                        <input type="text" class="form-control" id="venue" placeholder="e.g. Main Hall">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Date</label>
                        <input type="date" class="form-control" id="date">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Time</label>
                        <input type="time" class="form-control" id="time">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Description</label>
                        <input type="text" class="form-control" id="description" placeholder="Event details">
                    </div>
                </div>
                <button type="submit" class="btn btn-brand mt-4"><i class="fa-solid fa-floppy-disk"></i> Save Event</button>
            </form>
        </div>
    </div>

    <div class="table-card card">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span>Upcoming Events</span>
            <input type="text" class="form-control form-control-sm w-auto" id="searchBox" placeholder="Search Events...">
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead><tr><th>ID</th><th>Event</th><th>Date</th><th>Time</th><th>Venue</th><th>Action</th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header modal-header-brand">
                    <h5 class="modal-title">Edit Event</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label">Event Name</label><input type="text" class="form-control mb-3" id="editEventName">
                    <label class="form-label">Date</label><input type="date" class="form-control mb-3" id="editDate">
                    <label class="form-label">Time</label><input type="time" class="form-control mb-3" id="editTime">
                    <label class="form-label">Venue</label><input type="text" class="form-control mb-3" id="editVenue">
                    <label class="form-label">Description</label><input type="text" class="form-control" id="editDescription">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-brand" id="updateBtn">Update Event</button>
                </div>
            </div>
        </div>
    </div>


</div>
